server {
    listen 80;
    listen [::]:80;
    server_name vana.gellaronline.cc;
    return 301 https://vana.gellaronline.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vana.gellaronline.cc;
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/vana/current;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    access_log /var/log/nginx/vana-access.log;
    error_log /var/log/nginx/vana-error.log warn;
}
