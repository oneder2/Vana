name: Development Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: read

jobs:
  check:
    name: Validate Project
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build Linux (Dev)
    runs-on: ubuntu-22.04
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - name: Set build metadata version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          BUILD_NUM="${{ github.run_number }}"
          BUILD_VERSION="${BASE_VERSION}+build.${BUILD_NUM}"
          echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $BUILD_VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dev-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows (Dev)
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\bin\
            C:\Users\runneradmin\.cargo\registry\index\
            C:\Users\runneradmin\.cargo\registry\cache\
            C:\Users\runneradmin\.cargo\git\db\
            src-tauri\target\
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set build metadata version
        id: version
        shell: pwsh
        run: |
          $packageJson = Get-Content package.json | ConvertFrom-Json
          $baseVersion = $packageJson.version
          $buildNum = "${{ github.run_number }}"
          $buildVersion = "$baseVersion+build.$buildNum"
          $msiVersion = "$baseVersion.$buildNum"
          "version=$buildVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_version=$msiVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_WINDOWS_MSI_VERSION: ${{ steps.version.outputs.msi_version }}
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android (Dev)
    runs-on: ubuntu-22.04
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.1"

          NDK_PATH=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1)
          if [ -z "$NDK_PATH" ]; then
            sdkmanager "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi

          TOOLCHAIN_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -d "$TOOLCHAIN_PATH" ]; then
            cd "$TOOLCHAIN_PATH"
            sudo ln -sf llvm-ranlib aarch64-linux-android-ranlib || true
            sudo ln -sf llvm-ar aarch64-linux-android-ar || true
            sudo ln -sf llvm-ranlib armv7a-linux-androideabi-ranlib || true
            sudo ln -sf llvm-ar armv7a-linux-androideabi-ar || true
            sudo ln -sf llvm-ranlib i686-linux-android-ranlib || true
            sudo ln -sf llvm-ar i686-linux-android-ar || true
            sudo ln -sf llvm-ranlib x86_64-linux-android-ranlib || true
            sudo ln -sf llvm-ar x86_64-linux-android-ar || true
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_PATH" >> "$GITHUB_PATH"
          echo "RANLIB=aarch64-linux-android-ranlib" >> "$GITHUB_ENV"
          echo "AR=aarch64-linux-android-ar" >> "$GITHUB_ENV"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Validate Android signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Setup Android keystore
        run: |
          mkdir -p android-keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-keystore/keystore.jks
          test -f android-keystore/keystore.jks

          mkdir -p src-tauri/gen/android/app
          cat > src-tauri/gen/android/app/keystore.properties << EOF
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=$PWD/android-keystore/keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Configure Android signing
        run: |
          python3 scripts/configure-android-signing.py
          grep -q "signingConfigs" src-tauri/gen/android/app/build.gradle.kts

      - name: Build Android APK
        run: |
          export AR=aarch64-linux-android-ar
          export RANLIB=aarch64-linux-android-ranlib
          npx tauri android build --target aarch64 --verbose
          find src-tauri/gen/android -type f \( -name "*.apk" -o -name "*.aab" \) | head -20

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-artifacts
          path: |
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup keystore
        if: always()
        run: |
          rm -rf android-keystore
          rm -f src-tauri/gen/android/app/keystore.properties
