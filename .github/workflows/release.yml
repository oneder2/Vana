name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Validate Project
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync release version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows (Signed)
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\bin\
            C:\Users\runneradmin\.cargo\registry\index\
            C:\Users\runneradmin\.cargo\registry\cache\
            C:\Users\runneradmin\.cargo\git\db\
            src-tauri\target\
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          $baseVersion = [regex]::Match($version, '^\d+\.\d+\.\d+').Value
          if (-not $baseVersion) {
            throw "Unable to derive base version from tag $tagName"
          }

          $buildNumber = 0
          if ($version -match '(alpha|beta|rc)\.(\d+)$') {
            $buildNumber = $matches[2]
          }

          $msiVersion = "$baseVersion.$buildNumber"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_version=$msiVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync release version
        shell: pwsh
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.msi_version }}"

      - name: Import Windows certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            throw "WINDOWS_CERTIFICATE secret is required"
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE_PASSWORD secret is required"
          }

          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          [System.IO.File]::WriteAllBytes(
            "$PWD\certificate\certificate.pfx",
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate `
            -FilePath "$PWD\certificate\certificate.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword `
            -ErrorAction Stop | Out-Null

          Remove-Item -Path "$PWD\certificate\certificate.pfx" -Force
          Remove-Item -Path "$PWD\certificate" -Force

      - name: Build Tauri app
        env:
          TAURI_WINDOWS_MSI_VERSION: ${{ steps.version.outputs.msi_version }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-22.04
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.1"

          NDK_PATH=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1)
          if [ -z "$NDK_PATH" ]; then
            sdkmanager "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi

          TOOLCHAIN_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          AR_PATH="$TOOLCHAIN_PATH/llvm-ar"
          RANLIB_PATH="$TOOLCHAIN_PATH/llvm-ranlib"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_PATH" >> "$GITHUB_PATH"
          echo "AR=$AR_PATH" >> "$GITHUB_ENV"
          echo "RANLIB=$RANLIB_PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$AR_PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=$RANLIB_PATH" >> "$GITHUB_ENV"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync release version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Initialize Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Validate Android signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Setup Android keystore
        run: |
          mkdir -p android-keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-keystore/keystore.jks
          test -f android-keystore/keystore.jks

          mkdir -p src-tauri/gen/android/app
          cat > src-tauri/gen/android/app/keystore.properties << EOF
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=$PWD/android-keystore/keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Configure Android signing
        run: |
          python3 scripts/configure-android-signing.py
          grep -q "signingConfigs" src-tauri/gen/android/app/build.gradle.kts

      - name: Build Android APK
        run: |
          npx tauri android build --target aarch64 --verbose

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: |
          rm -rf android-keystore
          rm -f src-tauri/gen/android/app/keystore.properties

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-android
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate build artifacts
        id: validate
        run: |
          linux_count=$(find artifacts/linux-artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) | wc -l)
          windows_count=$(find artifacts/windows-artifacts -type f \( -name "*.exe" -o -name "*.msi" \) | wc -l)
          android_count=$(find artifacts/android-artifacts -type f \( -name "*.apk" -o -name "*.aab" \) | wc -l)

          test "$linux_count" -gt 0
          test "$windows_count" -gt 0
          test "$android_count" -gt 0

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release-type
        run: |
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Create Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "No Visitors ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}

            Automated release build for No Visitors.

            - Linux: `.deb`, `.AppImage`, `.rpm`
            - Windows: `.exe`, `.msi`
            - Android: `.apk`
          draft: true
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          files: |
            artifacts/linux-artifacts/**/*
            artifacts/windows-artifacts/**/*
            artifacts/android-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
