name: Build and Release

on:
  workflow_dispatch:
    inputs:
      windows_native_acceptance:
        description: Run Windows native UI and live Auth with a disposable account
        type: boolean
        default: false
      android_native_acceptance_tools:
        description: Build separate same-signer Android test instrumentation
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VANA_PUBLIC_SUPABASE_URL: ${{ vars.VANA_PUBLIC_SUPABASE_URL }}
  VANA_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.VANA_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  check:
    name: Validate Project
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Frontend behavior tests
        run: npm test

      - name: Native domain regressions
        run: cargo test -j 2 --locked --manifest-path tests/native-core/Cargo.toml

      - name: Supabase protocol regressions
        run: python3 scripts/test-supabase-protocol.py

      - name: Validate hosted release configuration
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check-supabase-release.py --require-protocol

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync release version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows (Signed)
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\bin\
            C:\Users\runneradmin\.cargo\registry\index\
            C:\Users\runneradmin\.cargo\registry\cache\
            C:\Users\runneradmin\.cargo\git\db\
            src-tauri\target\
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF_NAME
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagName -replace '^v', ''
          } else {
            (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          $baseVersion = [regex]::Match($version, '^\d+\.\d+\.\d+').Value
          if (-not $baseVersion) {
            throw "Unable to derive base version from tag $tagName"
          }

          $buildNumber = 0
          if ($version -match '(alpha|beta|rc)\.(\d+)$') {
            $buildNumber = $matches[2]
          }

          $msiVersion = "$baseVersion.$buildNumber"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_version=$msiVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync release version
        shell: pwsh
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.msi_version }}"

      - name: Import Windows certificate
        shell: pwsh
        timeout-minutes: 3
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            throw "WINDOWS_CERTIFICATE secret is required"
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE_PASSWORD secret is required"
          }

          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          [System.IO.File]::WriteAllBytes(
            "$PWD\certificate\certificate.pfx",
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate `
            -FilePath "$PWD\certificate\certificate.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword `
            -ErrorAction Stop
          $signer = @($imported | Where-Object { $_.HasPrivateKey })
          if ($signer.Count -ne 1) { throw "Expected exactly one certificate with a private key" }
          if ($signer[0].NotAfter -le (Get-Date)) { throw "Signing certificate has expired" }
          $thumbprint = $signer[0].Thumbprint
          "VANA_WINDOWS_SIGNER_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append
          @{ bundle = @{ windows = @{ certificateThumbprint = $thumbprint } } } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 windows-signing.json
          if ($signer[0].Subject -eq $signer[0].Issuer) {
            # Trust only on the disposable runner so Authenticode verifies integrity.
            # This does not give end-user machines a trusted publisher certificate.
            Export-Certificate -Cert $signer[0] -FilePath "$env:RUNNER_TEMP\vana-signer.cer" | Out-Null
            # CurrentUser\Root can show a confirmation dialog and hang CI.
            # The hosted runner is an administrator; machine-store import has no UI.
            & certutil.exe -f -addstore Root "$env:RUNNER_TEMP\vana-signer.cer" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Unable to trust the signer on the disposable runner" }
            Write-Host "Using a project self-signed certificate; public publisher trust is not provided"
          }

          Remove-Item -Path "$PWD\certificate\certificate.pfx" -Force
          Remove-Item -Path "$PWD\certificate" -Force

      - name: Build Tauri app
        env:
          TAURI_WINDOWS_MSI_VERSION: ${{ steps.version.outputs.msi_version }}
        run: npm run tauri:build -- --config windows-signing.json

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' })
          $files += Get-Item src-tauri/target/release/vana.exe
          if ($files.Count -lt 3) { throw "Expected EXE, MSI and application executable" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Thumbprint -ne $env:VANA_WINDOWS_SIGNER_THUMBPRINT) {
              throw "Invalid or unexpected signature: $($file.Name) ($($signature.Status))"
            }
          }

      - name: Windows native application and real Auth acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.windows_native_acceptance
        shell: pwsh
        env:
          ACCEPTANCE_CONFIG: ${{ secrets.VANA_NATIVE_ACCEPTANCE_ACCOUNT }}
        run: |
          if (-not $env:ACCEPTANCE_CONFIG) { throw 'Disposable acceptance account is required' }
          $path = "$env:RUNNER_TEMP\vana-native-account.json"
          [System.IO.File]::WriteAllText($path, $env:ACCEPTANCE_CONFIG)
          $env:VANA_NATIVE_ACCEPTANCE_CONFIG = $path
          try {
            $uiError = $null
            try { ./scripts/test-windows-native.ps1 -InstallerRoot src-tauri/target/release/bundle }
            catch { $uiError = $_ }
            cargo run -j 2 --locked --manifest-path tests/native-core/Cargo.toml --example live_auth_probe
            if ($LASTEXITCODE -ne 0) { throw 'Native Auth acceptance failed' }
            if ($uiError) { throw $uiError }
          } finally {
            Remove-Item $path -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-22.04
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          NDK_PATH=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1)
          if [ -z "$NDK_PATH" ]; then
            sdkmanager "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi

          TOOLCHAIN_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          AR_PATH="$TOOLCHAIN_PATH/llvm-ar"
          RANLIB_PATH="$TOOLCHAIN_PATH/llvm-ranlib"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_PATH" >> "$GITHUB_PATH"
          echo "AR=$AR_PATH" >> "$GITHUB_ENV"
          echo "RANLIB=$RANLIB_PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$AR_PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=$RANLIB_PATH" >> "$GITHUB_ENV"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync release version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Initialize Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Build Android with release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VANA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VANA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VANA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VANA_ANDROID_USE_DEBUG_SIGNING: "0"
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ['ANDROID_KEYSTORE_BASE64', 'VANA_ANDROID_KEYSTORE_PASSWORD',
                   'VANA_ANDROID_KEY_ALIAS', 'VANA_ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('All Android release signing secrets are required')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vana-release.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          export VANA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/vana-release.jks"
          npm run tauri:build:android
          keytool -exportcert -keystore "$VANA_ANDROID_KEYSTORE_PATH" \
            -alias "$VANA_ANDROID_KEY_ALIAS" -storepass:env VANA_ANDROID_KEYSTORE_PASSWORD \
            -file "$RUNNER_TEMP/vana-release.der"
          expected=$(sha256sum "$RUNNER_TEMP/vana-release.der" | cut -d ' ' -f 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            dist/android/vana-*-android-release.apk > "$RUNNER_TEMP/vana-apk-signature.txt"
          python3 scripts/check-android-release-signature.py "$expected" "$RUNNER_TEMP/vana-apk-signature.txt"
          python3 scripts/check-android-release-signature.py --aab \
            "$expected" dist/android/vana-*-android-release.aab
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.android_native_acceptance_tools }}" == 'true' ]]; then
            python3 scripts/build-android-acceptance.py
          fi
          export VANA_RELEASE_SIGNER_SHA256="$expected"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist/android')
          manifest = {
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'certificate_sha256': os.environ['VANA_RELEASE_SIGNER_SHA256'],
              'artifacts': {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                            for p in root.iterdir() if p.suffix in ('.apk', '.aab')},
          }
          (root / 'android-release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Verify Release JNI contract
        run: python3 scripts/check-android-jni.py src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            dist/android/*-android-release.apk
            dist/android/*-android-release.aab
            dist/android/android-release-manifest.json
            dist/android/vana-native-acceptance.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vana-release.jks" "$RUNNER_TEMP/vana-release.der"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-android
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate build artifacts
        id: validate
        run: |
          linux_count=$(find artifacts/linux-artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) | wc -l)
          windows_count=$(find artifacts/windows-artifacts -type f \( -name "*.exe" -o -name "*.msi" \) | wc -l)
          android_count=$(find artifacts/android-artifacts -type f \( -name "*.apk" -o -name "*.aab" \) | wc -l)

          test "$linux_count" -gt 0
          test "$windows_count" -gt 0
          test "$android_count" -gt 0

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release-type
        run: |
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Create Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Vana ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}

            本地优先的文档编辑器：正文修改记录、版本差异与受保护的恢复、空间备份、同步冲突对照。

            升级前请导出空间备份。Hosted 同步需要完整的 revision 协议迁移；旧客户端不能继续写入已升级的云端。
            文档为明文存储；修改记录只恢复正文，不恢复历史标题、标签或目录。云附件尚未提供。
            当前 Windows 使用项目自签名证书，系统可能提示未知发行者。

            - Linux: `.deb`, `.AppImage`, `.rpm`
            - Windows: `.exe`, `.msi`
            - Android: `.apk`, `.aab`
          draft: true
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          files: |
            artifacts/linux-artifacts/**/*
            artifacts/windows-artifacts/**/*
            artifacts/android-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
