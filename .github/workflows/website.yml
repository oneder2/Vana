name: Website Checks

on:
  push:
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release selection and atomic publishing
        run: python3 -m unittest discover -s website -p 'test_*.py'
      - name: Check browser enhancement and deployment syntax
        run: |
          node --check website/site.js
          node --check website/effects.js
          bash -n website/deploy.sh website/deploy/install-host.sh
